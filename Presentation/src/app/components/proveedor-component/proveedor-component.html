<div class="contenedor-pagina">
  <div class="cabecera-modulo">
    <h2>Proveedores</h2>
    <button mat-flat-button color="primary" (click)="abrirFormulario()">
      <mat-icon>add</mat-icon> Nuevo Proveedor
    </button>
  </div>

  <mat-card class="tabla-card">
    <table mat-table [dataSource]="proveedores()" class="w-100">
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let p">{{ p.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="telefono">
        <th mat-header-cell *matHeaderCellDef>Teléfono</th>
        <td mat-cell *matCellDef="let p">{{ p.telefono || '-' }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let p">{{ p.email || '-' }}</td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let p">
          <button mat-icon-button color="primary" (click)="abrirFormulario(p)"><mat-icon>edit</mat-icon></button>
          <button mat-icon-button color="warn" (click)="eliminarProveedor(p)"><mat-icon>delete</mat-icon></button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
    </table>
  </mat-card>
</div>
