<h2 mat-dialog-title>{{ data.titulo }}</h2>
<mat-dialog-content>
  <p>{{ data.mensaje }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="false">{{ data.textoCancelar || 'Cancelar' }}</button>
  <button mat-flat-button color="warn" [mat-dialog-close]="true">{{ data.textoConfirmar || 'Confirmar' }}</button>
</mat-dialog-actions>
