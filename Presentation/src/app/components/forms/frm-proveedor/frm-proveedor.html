<h2 mat-dialog-title>{{ data ? 'Editar Proveedor' : 'Nuevo Proveedor' }}</h2>
<mat-dialog-content>
  <form [formGroup]="formProveedor" style="display: flex; flex-direction: column; gap: 6px; padding-top: 8px;">
    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Teléfono</mat-label>
      <input matInput formControlName="telefono">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Correo electrónico</mat-label>
      <input matInput type="email" formControlName="email">
    </mat-form-field>
    @if (errorMsg()) {
      <p style="color: #dc2626; font-size: 13px; margin: 0;">{{ errorMsg() }}</p>
    }
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-flat-button color="primary" (click)="guardar()" [disabled]="formProveedor.invalid">Guardar</button>
</mat-dialog-actions>
