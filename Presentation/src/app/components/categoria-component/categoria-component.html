<div class="contenedor-pagina">
  <div class="cabecera-modulo">
    <h2>Categorías</h2>
    <button mat-flat-button color="primary" (click)="abrirFormulario()">
      <mat-icon>add</mat-icon> Nueva Categoría
    </button>
  </div>

  <mat-card class="tabla-card">
    <table mat-table [dataSource]="categorias()" class="w-100">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let c">{{ c.id }}</td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let c">{{ c.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let c">
          <button mat-icon-button color="primary" (click)="abrirFormulario(c)"><mat-icon>edit</mat-icon></button>
          <button mat-icon-button color="warn" (click)="eliminarCategoria(c)"><mat-icon>delete</mat-icon></button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
    </table>
  </mat-card>
</div>
