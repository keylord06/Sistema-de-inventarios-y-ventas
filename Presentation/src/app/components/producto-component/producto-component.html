<div class="contenedor-pagina">
  <div class="cabecera-modulo">
    <h2>Productos</h2>
    <button mat-flat-button color="primary" (click)="abrirFormulario()">
      <mat-icon>add</mat-icon> Nuevo Producto
    </button>
  </div>

  <mat-card class="tabla-card">
    <table mat-table [dataSource]="productos()" class="w-100">
      <ng-container matColumnDef="codigo">
        <th mat-header-cell *matHeaderCellDef>Código</th>
        <td mat-cell *matCellDef="let p">{{ p.codigo }}</td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let p">{{ p.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="precio">
        <th mat-header-cell *matHeaderCellDef>Precio</th>
        <td mat-cell *matCellDef="let p">₡{{ p.precio }}</td>
      </ng-container>

      <ng-container matColumnDef="stock">
        <th mat-header-cell *matHeaderCellDef>Stock</th>
        <td mat-cell *matCellDef="let p" [style.color]="p.stock <= p.stock_minimo ? '#dc2626' : 'inherit'">
          {{ p.stock }}
        </td>
      </ng-container>

      <ng-container matColumnDef="stock_minimo">
        <th mat-header-cell *matHeaderCellDef>Stock Mín.</th>
        <td mat-cell *matCellDef="let p">{{ p.stock_minimo }}</td>
      </ng-container>

      <ng-container matColumnDef="activo">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let p">{{ p.activo ? 'Activo' : 'Inactivo' }}</td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let p">
          <button mat-icon-button color="primary" (click)="abrirFormulario(p)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="eliminarProducto(p)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
    </table>
  </mat-card>
</div>
