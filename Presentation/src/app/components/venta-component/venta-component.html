<div class="contenedor-pagina">
  <div class="cabecera-modulo">
    <h2>Ventas</h2>
    <button mat-flat-button color="primary" (click)="abrirNuevaVenta()">
      <mat-icon>point_of_sale</mat-icon> Nueva Venta
    </button>
  </div>

  <mat-card class="tabla-card">
    <table mat-table [dataSource]="ventas()" class="w-100">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef># Venta</th>
        <td mat-cell *matCellDef="let v">{{ v.id }}</td>
      </ng-container>

      <ng-container matColumnDef="cliente_id">
        <th mat-header-cell *matHeaderCellDef>ID Cliente</th>
        <td mat-cell *matCellDef="let v">{{ v.cliente_id || 'General' }}</td>
      </ng-container>

      <ng-container matColumnDef="fecha">
        <th mat-header-cell *matHeaderCellDef>Fecha</th>
        <td mat-cell *matCellDef="let v">{{ v.fecha }}</td>
      </ng-container>

      <ng-container matColumnDef="total">
        <th mat-header-cell *matHeaderCellDef>Total</th>
        <td mat-cell *matCellDef="let v">₡{{ v.total }}</td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let v">{{ v.estado }}</td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let v">
          @if (v.estado !== 'Anulada') {
            <button mat-icon-button color="warn" title="Anular" (click)="anularVenta(v)">
              <mat-icon>block</mat-icon>
            </button>
          }
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
    </table>
  </mat-card>
</div>
