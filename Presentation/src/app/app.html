@if (authService.estaAutenticado()) {
  <mat-sidenav-container class="layout-container">
    <mat-sidenav mode="side" opened class="menu-lateral">
      <div class="logo-box">
        <mat-icon color="primary">inventory</mat-icon>
        <span>Inventario & Ventas</span>
      </div>

      <mat-nav-list>
        <a mat-list-item routerLink="/home" routerLinkActive="activo">
          <mat-icon matListItemIcon>dashboard</mat-icon>
          <span matListItemTitle>Inicio</span>
        </a>
        <a mat-list-item routerLink="/productos" routerLinkActive="activo">
          <mat-icon matListItemIcon>inventory_2</mat-icon>
          <span matListItemTitle>Productos</span>
        </a>
        <a mat-list-item routerLink="/categorias" routerLinkActive="activo">
          <mat-icon matListItemIcon>category</mat-icon>
          <span matListItemTitle>Categorías</span>
        </a>
        <a mat-list-item routerLink="/proveedores" routerLinkActive="activo">
          <mat-icon matListItemIcon>local_shipping</mat-icon>
          <span matListItemTitle>Proveedores</span>
        </a>
        <a mat-list-item routerLink="/clientes" routerLinkActive="activo">
          <mat-icon matListItemIcon>groups</mat-icon>
          <span matListItemTitle>Clientes</span>
        </a>
        <a mat-list-item routerLink="/ventas" routerLinkActive="activo">
          <mat-icon matListItemIcon>point_of_sale</mat-icon>
          <span matListItemTitle>Ventas</span>
        </a>
        <a mat-list-item routerLink="/reportes" routerLinkActive="activo">
          <mat-icon matListItemIcon>bar_chart</mat-icon>
          <span matListItemTitle>Reportes</span>
        </a>
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content>
      <mat-toolbar class="barra-superior">
        <span style="flex: 1;"></span>
        <button mat-button (click)="cerrarSesion()">
          <mat-icon>logout</mat-icon> Salir
        </button>
      </mat-toolbar>

      <main>
        <router-outlet />
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
} @else {
  <router-outlet />
}
