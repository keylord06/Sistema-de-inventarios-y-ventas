services:
  db:
    image: mysql:9.7
    container_name: inventario_bd
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_DATABASE: inventario_ventas
      # Usuario de la app, con privilegios solo sobre inventario_ventas (no root).
      MYSQL_USER: app_user
      MYSQL_PASSWORD_FILE: /run/secrets/db_app_password
    ports:
      - 3310:3306
    volumes:
      - ./db_dump:/docker-entrypoint-initdb.d
      - ./mysql:/var/lib/mysql
    secrets:
      - db_password
      - db_app_password
  webdatos:
    container_name: inventario_datos
    environment:
      DB_PASSWORD_FILE: /run/secrets/db_app_password
    volumes:
      - ./Data/public:/var/www/html/public
      - ./Data/src:/var/www/html/src
    build:
      context: .
      dockerfile: ./Data/Dockerfile
    # Sin "ports": Datos solo se alcanza por la red interna de Docker
    # (http://webdatos/api), nunca directo desde fuera del contenedor.
    secrets:
      - db_app_password
    depends_on:
      - db

  webnegocio:
    container_name: inventario_negocio
    volumes:
      - ./Business/public:/var/www/html/public
      - ./Business/src:/var/www/html/src
    build:
      context: .
      dockerfile: ./Business/Dockerfile
    ports:
      - 9090:80
    depends_on:
      - webdatos

  webpresentacion:
    container_name: inventario_presentacion
    build:
      context: ./Presentation
      dockerfile: Dockerfile
    ports:
      - 4200:80
    depends_on:
      - webnegocio
secrets:
  db_password:
    file: ./db_password.txt
  db_app_password:
    file: ./db_app_password.txt
